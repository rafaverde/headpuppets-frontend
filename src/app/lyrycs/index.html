<title>Head Puppets Stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
<style>
  :root{
    --bg:#0A0A0F; --surface:#14141B; --surface2:#1C1C26; --line:#2A2A38;
    --text:#F2F2F5; --muted:#8B8B9A;
    --enrique:#63C4FF; --anna:#FF8FC4; --coro:#7CE8A4; --rafael:#C9A2FF; --cue:#FFB84D;
    --action:#FF3D2E; --action-press:#D62F22;
    --font-d:'Anton',system-ui,sans-serif; --font-b:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-b);overscroll-behavior:none}
  button{font-family:var(--font-b);cursor:pointer;border:none}
  input{font-family:var(--font-b)}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- generic ---------- */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;
       padding:10px 16px;font-size:15px;font-weight:600;letter-spacing:.02em}
  .btn:active{background:var(--line)}
  .btn.primary{background:var(--action);border-color:var(--action);color:#fff}
  .btn.primary:active{background:var(--action-press)}
  .btn.ghost{background:transparent}
  .badge-key{font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--bg);
             background:var(--text);border-radius:7px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
  .dot.E{background:var(--enrique)} .dot.A{background:var(--anna)} .dot.R{background:var(--rafael)}

  /* ---------- top nav ---------- */
  .nav{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:none}
  .brand{font-family:var(--font-d);font-size:24px;letter-spacing:.05em;line-height:1;margin-right:auto;
         color:var(--text);text-transform:uppercase}
  .brand small{display:block;font-family:var(--font-b);font-size:10px;font-weight:600;letter-spacing:.32em;color:var(--action);margin-top:3px}
  .tab{background:transparent;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.06em;
       padding:9px 14px;border-radius:9px;text-transform:uppercase}
  .tab.on{color:var(--text);background:var(--surface2)}

  /* ---------- icons / campos ---------- */
  .ic{vertical-align:-2px}
  .btn .ic{margin-right:2px}
  .badge-key.kbtn{border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 10px}
  .badge-key.kbtn:active{background:var(--muted)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin-bottom:7px}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:8px}
  select.setname{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  textarea.lyr-ta{min-height:320px;resize:vertical;line-height:1.6;font-size:15px}

  /* ---------- home ---------- */
  .searchwrap{padding:14px 16px 6px;flex:none;display:flex;gap:10px;align-items:stretch}
  .searchwrap .search{flex:1;min-width:0}
  .addnew{flex:none;font-size:11.5px;font-weight:800;line-height:1.25;letter-spacing:.04em;padding:6px 13px}
  .search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
          color:var(--text);font-size:18px;padding:13px 16px;outline:none}
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--enrique)}
  .chips{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;flex:none}
  .chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:99px;
        padding:7px 14px;font-size:13px;font-weight:700;letter-spacing:.03em}
  .chip.on{color:var(--bg);background:var(--text);border-color:var(--text)}
  .songlist{flex:1;overflow-y:auto;padding:4px 10px 30px;min-height:0}
  .songrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;
           color:var(--text);padding:13px 10px;border-bottom:1px solid var(--line);border-radius:0}
  .songrow:active{background:var(--surface)}
  .songrow .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px;width:26px;flex:none;text-align:right}
  .songrow .tt{flex:1;min-width:0}
  .songrow .t1{font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .songrow .t2{color:var(--muted);font-size:12.5px;margin-top:2px}
  .warn{color:var(--cue);font-size:11px;font-weight:700;letter-spacing:.05em}
  .count{padding:8px 18px;color:var(--muted);font-size:12px;flex:none}

  /* ---------- song view ---------- */
  .songbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
  .songbar .back{font-size:22px;padding:6px 12px;background:transparent;color:var(--muted)}
  .songbar .stitle{flex:1;min-width:0;font-family:var(--font-d);font-size:21px;letter-spacing:.03em;
                   text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  .songbar .sartist{font-family:var(--font-b);display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600;margin-top:2px;text-transform:none}
  .navarrow{background:transparent;color:var(--muted);font-size:24px;padding:6px 10px}
  .navarrow:disabled{opacity:.25}
  .lyrics{flex:1;overflow-y:auto;min-height:0;padding:4vh 20px 70vh;scroll-behavior:auto}
  .lwrap{max-width:820px;margin:0 auto}
  .lline{font-weight:700;line-height:1.42;margin:0}
  .lline.verse{}
  .lline.chorus{color:var(--coro)}
  .lline.cue{color:var(--cue);font-style:italic;font-weight:600;opacity:.95;margin:.35em 0}
  .lline.cue::before{content:"▸ "}
  .lgap{height:1.15em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 3.5vh;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .nolyrics{border:1px solid var(--cue);border-radius:12px;padding:18px;color:var(--cue);font-size:16px;line-height:1.5}

  .controls{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
            border-top:1px solid var(--line);background:var(--surface);transition:opacity .4s}
  .controls.dim{opacity:.3}
  .controls .btn.go{font-size:16px;font-weight:800;padding:13px 20px;letter-spacing:.05em;min-width:120px}
  .speed{display:flex;align-items:center;gap:8px;flex:1;min-width:110px}
  .speed input{flex:1;accent-color:var(--action);min-width:70px}
  .speed label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;white-space:nowrap}
  .fbtn{font-size:17px;font-weight:800;padding:11px 14px}

  /* ---------- modals ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(3,3,6,.82);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:900px;
         max-height:86dvh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
  .modal h2{font-family:var(--font-d);font-size:22px;letter-spacing:.04em;margin:0 0 4px;text-transform:uppercase}
  .modal .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .mclose{position:sticky;top:0;float:right;background:var(--surface2);border:1px solid var(--line);color:var(--text);
          border-radius:99px;width:38px;height:38px;font-size:17px}
  .chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .chordcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
  .chordcard .cname{font-weight:800;font-size:17px;margin-bottom:2px}
  .chordcard .cfun{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-bottom:8px}
  .chordcard .cnotes{color:var(--muted);font-size:12.5px;margin-top:7px;font-variant-numeric:tabular-nums}
  .harpcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .harpcard h3{margin:0 0 2px;font-size:16px;font-weight:800}
  .harpcard .pos{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .harpkey{font-family:var(--font-d);font-size:44px;line-height:1;margin:10px 0 4px;color:var(--cue)}
  .harprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .hbx{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
  .hbx b{color:var(--cue)}
  .harpnote{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:10px}

  /* ---------- setlists ---------- */
  .setwrap{flex:1;overflow-y:auto;padding:16px;min-height:0}
  .setcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .setcard h3{margin:0;font-family:var(--font-d);font-size:19px;letter-spacing:.03em;text-transform:uppercase}
  .setcard .meta{color:var(--muted);font-size:12.5px;margin:4px 0 12px}
  .setbtns{display:flex;gap:8px;flex-wrap:wrap}
  .setbtns .btn{font-size:13px;padding:9px 13px}
  .editrow{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line)}
  .editrow .tt{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .editrow .k{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .mini{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;
        width:36px;height:36px;font-size:15px;font-weight:800;flex:none}
  .mini.del{color:var(--action)}
  .addarea{margin-top:14px}
  .setname{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
        color:var(--text);font-size:16px;padding:11px 14px;outline:none;margin-bottom:10px;font-family:var(--font-b)}
  .setname:focus{border-color:var(--enrique)}
  .pickresults{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
  .pickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--text);
           padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
  .pickrow:active{background:var(--surface2)}
  .pickrow .k{margin-left:auto;color:var(--muted);font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:15px;line-height:1.6}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  @media (prefers-reduced-motion: reduce){ .lyrics{scroll-behavior:auto} }
</style>

/* ---------- músicas adicionadas/editadas pelo usuário ---------- */
function parseRaw(raw) {
  const out = [];
  String(raw || '').split('\n').forEach(l => {
    const s = l.trim();
    if (!s) { if (out.length && out[out.length-1].t !== 'gap') out.push({ t: 'gap', x: '' }); return; }
    if (/^\(.*\)$/.test(s)) out.push({ t: 'cue', x: s.replace(/^\(|\)$/g, '').trim() });
    else if (s.startsWith('*')) out.push({ t: 'chorus', x: s.replace(/^\*+\s*/, '') });
    else out.push({ t: 'verse', x: s });
  });
  while (out.length && out[out.length-1].t === 'gap') out.pop();
  return out;
}
function linesToRaw(lines) {
  return (lines || []).map(l =>
    l.t === 'gap' ? '' : l.t === 'cue' ? `(${l.x})` : l.t === 'chorus' ? `* ${l.x}` : l.x
  ).join('\n');
}
const custom = (() => {
  const c = LS.get('hp_custom', { added: [], edits: {} });
  if (!Array.isArray(c.added)) c.added = [];
  if (!c.edits || typeof c.edits !== 'object') c.edits = {};
  return c;
})();
const saveCustom = () => LS.set('hp_custom', custom);
function applyCustom() {
  custom.added.forEach(a => {
    let s = byId[a.id];
    if (!s) { s = { setOrder: null }; SONGS.push(s); byId[a.id] = s; }
    Object.assign(s, { id: a.id, title: a.title, artist: a.artist || '', key: a.key || null,
                       singers: a.singers, lines: parseRaw(a.raw), custom: true });
  });
  Object.keys(custom.edits).forEach(id => {
    const e = custom.edits[id], s = byId[id];
    if (!s) return;
    if (e.title) s.title = e.title;
    if (e.artist != null) s.artist = e.artist;
    if ('key' in e) s.key = e.key || null;
    if (e.singers) s.singers = e.singers;
    if (e.raw != null) s.lines = parseRaw(e.raw);
  });
}
applyCustom();

/* ---------- music theory ---------- */
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const HARPN = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const PC = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

function parseKey(k) {
  if (!k) return null;
  const first = k.split('/')[0].trim();
  const m = first.match(/^([A-G][#b]?)(m?)$/);
  if (!m) return null;
  return { root: PC[m[1]], minor: m[2] === 'm', label: first };
}
function noteName(pc, flats) { return (flats ? FLAT : SHARP)[((pc % 12) + 12) % 12]; }

function keyChords(key) {
  const flats = key.minor ? [2,7,0,5,10].includes(key.root) : [5,10,3,8].includes(key.root);
  const N = pc => noteName(pc, flats);
  const r = key.root;
  if (!key.minor) return [
    { name: N(r),        fun: 'I — tônica',        root: r,    minor: false },
    { name: N(r+5),      fun: 'IV — subdominante', root: r+5,  minor: false },
    { name: N(r+7),      fun: 'V — dominante',     root: r+7,  minor: false },
    { name: N(r+9)+'m',  fun: 'vi — relativa',     root: r+9,  minor: true  },
  ];
  return [
    { name: N(r)+'m',    fun: 'i — tônica',        root: r,    minor: true  },
    { name: N(r+3),      fun: 'III — relativa',    root: r+3,  minor: false },
    { name: N(r+5)+'m',  fun: 'iv',                root: r+5,  minor: true  },
    { name: N(r+7)+'m',  fun: 'v',                 root: r+7,  minor: true  },
    { name: N(r+8),      fun: 'VI',                root: r+8,  minor: false },
    { name: N(r+10),     fun: 'VII',               root: r+10, minor: false },
  ];
}

const BLACK_AFTER = {1:0, 3:1, 6:3, 8:4, 10:5}; /* pc -> white index it follows */
function chordSVG(rootPc, minor) {
  const tones = [rootPc % 12, (rootPc + (minor ? 3 : 4)) % 12, (rootPc + 7) % 12];
  /* absolute voicing starting at root within 2 octaves */
  const base = rootPc % 12;
  const abs = [base, base + (minor ? 3 : 4), base + 7];
  const wW = 26, wH = 82, bW = 16, bH = 52, nW = 14;
  let whites = '', blacks = '';
  for (let i = 0; i < nW; i++) {
    const oct = Math.floor(i / 7), pc = WHITE_PCS[i % 7], a = oct * 12 + pc;
    const hi = abs.indexOf(a);
    const fill = hi === 0 ? '#FFB84D' : hi > 0 ? '#63C4FF' : '#F2F2F5';
    whites += `<rect x="${i*wW}" y="0" width="${wW-1.2}" height="${wH}" rx="3" fill="${fill}" stroke="#0A0A0F" stroke-width="1.2"/>`;
  }
  for (let oct = 0; oct < 2; oct++) for (const pcs in BLACK_AFTER) {
    const pc = +pcs, wi = oct * 7 + BLACK_AFTER[pcs], a = oct * 12 + pc;
    const hi = abs.indexOf(a);
    const fill = hi === 0 ? '#FFB84D' : hi > 0 ? '#63C4FF' : '#16161E';
    blacks += `<rect x="${(wi+1)*wW - bW/2}" y="0" width="${bW}" height="${bH}" rx="2.5" fill="${fill}" stroke="#0A0A0F" stroke-width="1.2"/>`;
  }
  return `<svg viewBox="0 0 ${nW*wW} ${wH}" style="width:100%;display:block">${whites}${blacks}</svg>`;
}

/* harmonica */
function harpInfo(key) {
  const N = pc => HARPN[((pc % 12) + 12) % 12];
  if (key.minor) return [
    { harp: N(key.root + 10), pos: '3ª posição — recomendada', why: 'Sonoridade menor natural: encaixa direto no tom menor da música, sem forçar bends.',
      boxes: [['Nota do tom', '4 aspirada (também 1 e 8)'], ['Solos', 'caixas 4 a 8'], ['Base / riffs', 'caixas 1 a 4 aspiradas']],
      note: 'Toque puxando mais AR (aspiradas) — é onde mora o acorde menor. Cuidado com a 3 soprada: solta a terça maior e briga com o tom.' },
    { harp: N(key.root + 5), pos: '2ª posição — alternativa blues', why: 'Pegada blues/rock para solos mais sujos e com bends.',
      boxes: [['Nota do tom', '2 aspirada (= 3 soprada)'], ['Solos', 'caixas 2 a 6, bends nas 2, 3 e 4'], ['Agudos', 'caixas 6 a 9']],
      note: 'Funciona pela escala de blues; evite sustentar a 5 soprada e a 7 aspirada nas partes menores.' },
  ];
  return [
    { harp: N(key.root + 5), pos: '2ª posição (cross harp) — recomendada', why: 'A posição clássica de rock e blues: solos com peso e bends expressivos.',
      boxes: [['Nota do tom', '2 aspirada (= 3 soprada)'], ['Base / ritmo', 'caixas 1 a 5'], ['Solos', 'caixas 2 a 6 aspiradas, bends nas 2, 3 e 4'], ['Agudos', 'caixas 6 a 9']],
      note: 'É a gaita para acompanhar e solar na maioria das músicas em tom maior.' },
    { harp: N(key.root), pos: '1ª posição — alternativa melódica', why: 'Boa para tocar o tema/melodia da música, som mais limpo.',
      boxes: [['Nota do tom', '1 e 4 sopradas'], ['Melodia', 'caixas 4 a 7'], ['Acordes', 'caixas 1 a 3 sopradas']],
      note: 'Use quando quiser dobrar a melodia do vocal ou fazer o riff literal.' },
  ];
}

function songMatches(s, q) {
  if (!q) return true;

    list.sort((a,b) => a.title.localeCompare(b.title));

  return list.filter(s => songMatches(s, q));
}

/* ----- song view ----- */
const tp = { running: false, raf: 0, last: 0 };
function stopTP() {
  tp.running = false;
  if (tp.raf) cancelAnimationFrame(tp.raf);
  tp.raf = 0;
}
function verseClass(s) {
  if (s.singers.length > 1) return 'multi';
  return s.singers[0];
}
function renderSong() {
  const s = byId[view.id];
  const idx = playlist.indexOf(s.id);
  const speed = speeds[s.id] || 35;
  const multi = s.singers.length > 1;
  const vColor = multi ? 'var(--text)' : s.singers[0] === 'E' ? 'var(--enrique)' : s.singers[0] === 'A' ? 'var(--anna)' : 'var(--rafael)';
  const singerNames = s.singers.map(x => x === 'E' ? 'Enrique' : x === 'A' ? 'Anna' : 'Rafael').join(' + ');

  app.innerHTML = `
    <div class="screen">
      <div class="songbar">
        <button class="back" id="back">‹</button>
        <div class="stitle">${s.title}<span class="sartist">${s.artist} &nbsp;·&nbsp; ${singerNames}</span></div>
        <button class="navarrow" id="prev" ${idx > 0 ? '' : 'disabled'}>«</button>
        <button class="navarrow" id="next" ${idx >= 0 && idx < playlist.length - 1 ? '' : 'disabled'}>»</button>
        <button class="navarrow" id="editbtn" title="Editar letra">${ICON.pencil}</button>

          <div class="legend">
            ${multi
              ? `<span><span class="dot" style="background:var(--text)"></span>versos divididos</span>`
              : `<span><span class="dot" style="background:${vColor}"></span>${singerNames}</span>`}
            <span><span class="dot" style="background:var(--coro)"></span>coro / juntos</span>
            <span><span class="dot" style="background:var(--cue)"></span>deixa / arranjo</span>
          </div>
          ${s.lines.length ? s.lines.map(l =>
              l.t === 'gap' ? '<div class="lgap"></div>'
            : l.t === 'cue' ? `<p class="lline cue">${esc(l.x)}</p>`
            : l.t === 'chorus' ? `<p class="lline chorus">${esc(l.x)}</p>`
            : `<p class="lline verse" style="color:${vColor}">${esc(l.x)}</p>`
          ).join('') : `<div class="nolyrics">Esta música ainda está sem letra.<br><br><button class="btn primary" id="addlyric">ADICIONAR LETRA</button></div>`}
        </div>
      </div>
      <div class="controls" id="ctrl">
        <button class="btn primary go" id="go">▶ INICIAR</button>
        <div class="speed">
          <label>VEL.</label>
          <input type="range" id="spd" min="8" max="110" step="1" value="${speed}">
        </div>
        <button class="btn fbtn" id="fminus">A−</button>
        <button class="btn fbtn" id="fplus">A+</button>
        <button class="btn" id="piano">${ICON.piano} PIANO</button>
        <button class="btn" id="harp">${ICON.harp} GAITA</button>
      </div>
    </div>`;

  const lyr = $('#lyr'), go = $('#go'), ctrl = $('#ctrl');

  $('#back').onclick = () => { stopTP(); dropWake(); view = { name: 'home' }; render(); };
  $('#prev').onclick = () => { if (idx > 0) openSong(playlist[idx - 1]); };
  $('#next').onclick = () => { if (idx < playlist.length - 1) openSong(playlist[idx + 1]); };

  /* teleprompter */
  function setBtn() {
    go.innerHTML = tp.running ? '❚❚ PAUSAR' : '▶ INICIAR';
    ctrl.classList.toggle('dim', tp.running);
  }
  function loop(now) {
    if (!tp.running) return;
    const dt = Math.min(now - tp.last, 100); tp.last = now;
    lyr.scrollTop += (speeds[s.id] || 35) * dt / 1000;
    if (lyr.scrollTop + lyr.clientHeight >= lyr.scrollHeight - 2) { stopTP(); setBtn(); return; }
    tp.raf = requestAnimationFrame(loop);
  }
  function startTP() {
    if (!s.lines.length) return;
    tp.running = true; tp.last = performance.now();
    tp.raf = requestAnimationFrame(loop);
    setBtn();
  }
  go.onclick = () => { tp.running ? (stopTP(), setBtn()) : startTP(); };

  /* tap lyrics toggles; drag pauses */
  let t0 = null, moved = false;
  lyr.addEventListener('touchstart', e => { t0 = e.touches[0].clientY; moved = false; }, { passive: true });
  lyr.addEventListener('touchmove', e => {
    if (t0 !== null && Math.abs(e.touches[0].clientY - t0) > 12) { moved = true; if (tp.running) { stopTP(); setBtn(); } }
  }, { passive: true });
  lyr.addEventListener('click', () => { if (!moved) { tp.running ? (stopTP(), setBtn()) : startTP(); } });

  $('#spd').oninput = e => { speeds[s.id] = +e.target.value; LS.set('hp_speeds', speeds); };
  $('#fminus').onclick = () => { fontSize = Math.max(17, fontSize - 2); LS.set('hp_fs', fontSize); $('.lwrap').style.fontSize = fontSize + 'px'; };
  $('#fplus').onclick = () => { fontSize = Math.min(46, fontSize + 2); LS.set('hp_fs', fontSize); $('.lwrap').style.fontSize = fontSize + 'px'; };

  $('#piano').onclick = () => showPiano(s);
  $('#harp').onclick = () => showHarp(s);
  $('#keybtn').onclick = () => showPiano(s);
  $('#editbtn').onclick = () => { stopTP(); view = { name: 'edit', id: s.id }; render(); };
  const al = $('#addlyric');
  if (al) al.onclick = e => { e.stopPropagation(); stopTP(); view = { name: 'edit', id: s.id }; render(); };
}

function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ----- modals ----- */
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.querySelector('.modal').insertAdjacentHTML('afterbegin', '<button class="mclose">✕</button>');
  bg.querySelector('.mclose').onclick = () => bg.remove();
  document.body.appendChild(bg);
  return bg;
}
function showPiano(s) {
  const key = parseKey(s.key);
  if (!key) { modal(`<h2>Piano</h2><p class="sub">O tom desta música ainda não está definido no repertório.</p>`); return; }
  const chords = keyChords(key);
  const flats = key.minor ? [2,7,0,5,10].includes(key.root) : [5,10,3,8].includes(key.root);
  modal(`
    <h2>${ICON.piano} Piano — tom de ${key.label}</h2>
    <p class="sub">Acordes principais do tom. <span style="color:var(--cue)">Laranja = fundamental</span> · <span style="color:var(--enrique)">azul = demais notas</span>.</p>
    <div class="chordgrid">
      ${chords.map(c => {
        const tones = [c.root, c.root + (c.minor ? 3 : 4), c.root + 7].map(p => noteName(p, flats));
        return `<div class="chordcard">
          <div class="cname">${c.name}</div>
          <div class="cfun">${c.fun}</div>
          ${chordSVG(((c.root % 12) + 12) % 12, c.minor)}
          <div class="cnotes">${tones.join(' – ')}</div>
        </div>`;
      }).join('')}
    </div>`);
}
function showHarp(s) {
  const key = parseKey(s.key);
  if (!key) { modal(`<h2>Gaita</h2><p class="sub">O tom desta música ainda não está definido no repertório.</p>`); return; }
  const infos = harpInfo(key);
  modal(`
    <h2>${ICON.harp} Gaita — tom de ${key.label}</h2>
    <p class="sub">Gaita diatônica de 10 caixas. “Caixa” = furo; aspirada = puxando o ar, soprada = soprando.</p>
    ${infos.map(i => `
      <div class="harpcard">
        <div class="pos">${i.pos}</div>
        <div class="harpkey">Gaita em ${i.harp}</div>
        <h3>${i.why}</h3>
        <div class="harprow">${i.boxes.map(([l, v]) => `<span class="hbx">${l}: <b>${v}</b></span>`).join('')}</div>
        <div class="harpnote">${i.note}</div>
      </div>`).join('')}`);
}

  });
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { view.edit = b.dataset.edit; render(); });
  app.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => {
    const st = sets.find(x => x.id === b.dataset.dup);
    sets.unshift({ id: 'set-' + Date.now(), name: st.name + ' (cópia)', songs: st.songs.slice() });
    saveSets(); render();
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Excluir esta setlist?')) return;
    sets = sets.filter(x => x.id !== b.dataset.del); saveSets(); render();
  });
}
function fmtDur(n) { const min = n * 4.5; return '~' + Math.round(min) + ' min'; }
function renderSetEditor(id) {
  const st = sets.find(x => x.id === id);
  if (!st) { view.edit = null; return renderSets(); }
  let pickQ = view.pickQ || '';
  const results = pickQ.trim()
    ? SONGS.filter(s => songMatches(s, strip(pickQ)) && !st.songs.includes(s.id)).slice(0, 12)
    : [];
  app.innerHTML = nav() + `
    <div class="screen"><div class="setwrap">
      <button class="btn ghost" id="backsets" style="margin-bottom:12px;color:var(--muted)">‹ Setlists</button>
      <input type="text" class="setname" id="setname" value="${st.name.replace(/"/g,'&quot;')}" maxlength="60">
      <div class="meta" style="color:var(--muted);font-size:12.5px;margin-bottom:10px">${st.songs.length} músicas — toque nas setas para reordenar</div>
      ${st.songs.map((sid, i) => {
        const s = byId[sid]; if (!s) return '';
        return `<div class="editrow">
          <span style="color:var(--muted);font-size:12px;width:22px;text-align:right;font-variant-numeric:tabular-nums">${i+1}</span>
          <span class="tt">${s.title} <span class="k">· ${s.key || '—'}</span></span>
          <button class="mini" data-up="${i}" ${i===0?'disabled':''}>↑</button>
          <button class="mini" data-dn="${i}" ${i===st.songs.length-1?'disabled':''}>↓</button>
          <button class="mini del" data-rm="${i}">✕</button>
        </div>`;
      }).join('') || '<div class="empty">Setlist vazia — busque abaixo para adicionar.</div>'}
      <div class="addarea">
        <input type="text" class="setname" id="pick" placeholder="Adicionar música… (buscar)" value="${pickQ.replace(/"/g,'&quot;')}">
        ${results.length ? `<div class="pickresults">${results.map(s =>
          `<button class="pickrow" data-add="${s.id}">${s.title}<span class="k">${s.key || '—'}</span></button>`).join('')}</div>` : ''}
      </div>
    </div></div>`;
  bindNav();
  $('#backsets').onclick = () => { view.edit = null; view.pickQ = ''; render(); };
  const nameEl = $('#setname');
  nameEl.onchange = () => { st.name = nameEl.value.trim() || st.name; saveSets(); };
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const i = +b.dataset.up; [st.songs[i-1], st.songs[i]] = [st.songs[i], st.songs[i-1]]; saveSets(); render();
  });
  app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => {
    const i = +b.dataset.dn; [st.songs[i+1], st.songs[i]] = [st.songs[i], st.songs[i+1]]; saveSets(); render();
  });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    st.songs.splice(+b.dataset.rm, 1); saveSets(); render();
  });
  const pick = $('#pick');
  pick.oninput = () => { view.pickQ = pick.value; render(); const p = $('#pick'); p.focus(); p.setSelectionRange(p.value.length, p.value.length); };
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    st.songs.push(b.dataset.add); saveSets(); view.pickQ = ''; render();
    const p = $('#pick'); if (p) p.focus();
  });
}

render();

</script>
